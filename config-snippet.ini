[plugin_ironclad_swap]
# Ironclad only: wear the Frenzied Berserker only while a hammer swing is
# made (its damage and crits are locked in at that moment), and the Boosters
# only while a mid-air jump starts a boost (the boost keeps its full speed
# and length). Your armor and Stompers are back on before the next frame.
enabled = yes
berserker = yes
# Bag item to swing in (the name only has to contain this).
berserker_name = Frenzied Berserker
boosters = yes
# Bag boots to boost with; "Boosters" also matches Overloaded Boosters.
booster_name = Boosters
# Input buffer left spare after the two inventory moves (75 each).
buffer_reserve = 75
